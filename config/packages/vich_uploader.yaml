vich_uploader:
    db_driver: orm
    mappings:
        class_logo:
            uri_prefix: /media/classes
            upload_destination: '%kernel.project_dir%/public/media/classes'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

        character_image:
            uri_prefix: /media/characters
            upload_destination: '%kernel.project_dir%/public/media/characters'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
